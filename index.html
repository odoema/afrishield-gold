<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AfriShield Gold</title>
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #120e0a; color: #efe7d6; }
      .site-header { position: sticky; top: 0; z-index: 10; }
      .notice {
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #c9a24a;
        color: #120e0a;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-align: center;
      }
      .n-long, .n-short { display: inline-block; }
      @media (max-width: 640px) {
        .n-long { display: none; }
      }
      @media (min-width: 641px) {
        .n-short { display: none; }
      }
      main { padding: 2rem; }
    </style>
  </head>
  <body>
    <header class="site-header" id="siteHeader">
      <div class="notice" role="note">
        <span class="n-long">Licensed Company</span>
        <span class="n-short">Licensed Company</span>
      </div>
    </header>
    <main>
      <h1>AfriShield Gold</h1>

  </body>
</html>
